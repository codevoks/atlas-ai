[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas AI control and query plane"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "email-validator==2.2.0",
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.10.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.13.1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_api"]
artifacts = ["src/atlas_api/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
packages = ["atlas_api"]
