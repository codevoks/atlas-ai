services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local_only
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - atlas-postgres-data:/var/lib/postgresql/data

volumes:
  atlas-postgres-data:

